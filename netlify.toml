[build]
  publish = "."
  functions = "netlify/functions"

# Короткий alias /api/ask-ai → Netlify Function
[[redirects]]
  from   = "/api/ask-ai"
  to     = "/.netlify/functions/ask-ai"
  status = 200
  force  = true

# SPA / PWA: отдаём index.html для корня
[[redirects]]
  from   = "/"
  to     = "/index.html"
  status = 200

# Заголовки безопасности для всего сайта
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options         = "SAMEORIGIN"
    X-Content-Type-Options  = "nosniff"
    Referrer-Policy         = "strict-origin-when-cross-origin"
    Permissions-Policy      = "camera=(), microphone=(self), geolocation=()"

# Function — без кэша
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

[functions]
  node_bundler = "esbuild"
  # Увеличиваем лимит ожидания ответа модели
  [functions."ask-ai"]
    timeout = 26
